name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: End-to-end test (drives the real app)
        run: node scripts/smoke-test.mjs examples/demo-deck.html "${{ runner.temp }}/hp-smoke"
      - name: Keep the screenshots if it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: ${{ runner.temp }}/hp-smoke/*.png
          if-no-files-found: ignore
